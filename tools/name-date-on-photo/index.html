<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Add Name and Date to Photo Online
  </title>

  <link
    rel="stylesheet"
    href="/assets/css/core.css"
  >

</head>

<body>

  <!-- HEADER -->
  <div id="st-header"></div>

  <!-- MOBILE NAV -->
  <div id="st-mobile-nav"></div>

  <!-- PAGE -->
  <main class="st-page">

    <h1 class="stc-title">
      Add Name and Date on Photo
    </h1>

    <div class="container">
  
      <div class="form-container">
    
        <label for="file">Select Your Photo</label>
    
        <div class="upload-container">
          <input
            type="file"
            id="imgInput"
            accept="image/*"
            onchange="previewImage(event)"
            required
          >
        </div>
    
        <label for="name">Type Full Name</label>
    
        <input
          type="text"
          id="name"
          placeholder="Enter Your Full Name"
          required
        >
    
        <label for="date">Select Date</label>
    
        <input
          type="date"
          id="date"
          required
        >
    
        <br>
    
        <button
          class="button"
          onclick="join()"
        >
          Add
        </button>
    
      </div>
    
      <div class="result">
    
        <canvas
          id="canvas"
          width="295"
          height="360"
        ></canvas>
    
      </div>
    
    </div>


    <!-- Other tools -->
    <div id="stc-other-tools"></div>
    
    <!-- AUTO SHARED -->
    <div id="stc-shareds"></div>

  </main>

  <!-- FOOTER -->
  <div id="st-footer"></div>

  <script type="module">

    import { loadLayout }
    from "/assets/js/core/app.js";

    loadLayout();

  </script>

  <script
    type="module"
    src="/assets/js/tools/name-date.js"
  ></script>

</body>
</html>
