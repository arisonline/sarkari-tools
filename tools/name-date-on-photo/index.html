<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Add Name and Date to Photo Online
  </title>

  <link
    rel="stylesheet"
    href="/assets/css/core.css"
  >

</head>

<body>

  <!-- HEADER -->
  <div id="st-header"></div>

  <!-- MOBILE NAV -->
  <div id="st-mobile-nav"></div>

  <!-- PAGE -->
  <main class="st-page">

    <h1 class="stc-title">
      Add Name and Date on Photo
    </h1>

    <div class="container">
  
      <div class="form-container">
    
        <label for="file">Select Your Photo</label>
    
        <div class="upload-container">
          <input
            type="file"
            id="imgInput"
            accept="image/*"
            onchange="previewImage(event)"
            required
          >
        </div>
    
        <label for="name">Type Full Name</label>
    
        <input
          type="text"
          id="name"
          placeholder="Enter Your Full Name"
          required
        >
    
        <label for="date">Select Date</label>
    
        <input
          type="date"
          id="date"
          required
        >
    
        <br>
    
        <button
          class="button"
          onclick="join()"
        >
          Add
        </button>
    
      </div>
    
      <div class="result">
    
        <canvas
          id="canvas"
          width="295"
          height="360"
        ></canvas>
    
      </div>
    
    </div>


    <!-- Other tools -->
    <div id="stc-other-tools"></div>

    <!-- SEO Contects -->
      <section class="stc-section">
      <h2 class="stc-title">Popular FAQ's related to name & date on photo joiner</h2>
  
      <div class="stc-card stc-faq-wrapper" id="stc-faq-box">
        <div class="stc-faq-item">
          <button class="stc-faq-btn" type="button">
            <span class="stc-faq-question">What types of image/photo does this tool support?</span>
            <span class="stc-faq-icon">+</span>
          </button>
          <div class="stc-faq-answer">
            <div class="stc-faq-answer-inner">
              ➤ All types of photos and signatures will be supported. Like: PNG, JPG, JPEG, etc.
            </div>
          </div>
        </div>
  
        <div class="stc-faq-item">
          <button class="stc-faq-btn" type="button">
            <span class="stc-faq-question">Is this name and date on photo tool free?</span>
            <span class="stc-faq-icon">+</span>
          </button>
          <div class="stc-faq-answer">
            <div class="stc-faq-answer-inner">
              ➤ Yes it is completely free.
            </div>
          </div>
        </div>
      </div>
    </section>
    
    <!-- AUTO SHARED -->
    <div id="stc-shareds"></div>

  </main>

  <!-- FOOTER -->
  <div id="st-footer"></div>

  <script type="module">

    import { loadLayout }
    from "/assets/js/core/app.js";

    loadLayout();

  </script>

  <script
    type="module"
    src="/assets/js/tools/name-date.js"
  ></script>

</body>
</html>
